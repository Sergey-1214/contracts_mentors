syntax = "proto3";

package posts.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/empty.proto";


option go_package = "github.com/Sergey-1214/contracts_mentors/post/v1;postsv1";

// -----------------------------------------------------------------------------
// ENUMS
// -----------------------------------------------------------------------------

// Статус публикации
enum PostStatus {
  DRAFT = 0;
  PUBLISHED = 1;
  ARCHIVED = 2;
}

// Порядок сортировки при запросе списка
enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  ASC = 1;
  DESC = 2;
}

// Поле, по которому выполняется сортировка
enum SortField {
  SORT_FIELD_UNSPECIFIED = 0;
  CREATED_AT = 1;
  UPDATED_AT = 2;
  TITLE = 3;
}

// -----------------------------------------------------------------------------
// ENTITIES
// -----------------------------------------------------------------------------

message Post {
  string id = 1;                         // UUID
  string author_id = 2;                  // ID автора
  string title = 3;                      // Заголовок
  string content = 4;                    // Основной текст
  repeated string tags = 5;              // Теги
  PostStatus status = 6;                 // Статус поста
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;

  double average_rating = 9;             // Средняя оценка (0, если нет оценок)
  int32 ratings_count = 10;              // Кол-во оценок
}

// -----------------------------------------------------------------------------
// REQUEST / RESPONSE MESSAGES
// -----------------------------------------------------------------------------

message CreatePostRequest {
  string author_id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  // Если не указан, на уровне сервиса трактуем как DRAFT.
  PostStatus status = 5;
}

message CreatePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  Post post = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePostResponse {
  Post post = 1;
}

// Оценка поста пользователем
message RatePostRequest {
  string post_id = 1;                    // ID поста
  string user_id = 2;                    // ID пользователя, который оценивает
  int32 rate = 3;                        // Например, 1–5
  string comment = 4;                    // Необязательный текстовый отзыв
}

message RatePostResponse {
  Post post = 1;                         // Пост с обновлёнными average_rating / ratings_count
}

message DeletePostRequest {
  string id = 1;
}

// Параметры листинга постов
message ListPostsRequest {
  int32 page_size = 1;                   // количество записей на странице
  string page_token = 2;                 // токен для пагинации
  string author_id = 3;                  // фильтр по автору
  PostStatus status = 4;                 // фильтр по статусу
  repeated string tags = 5;              // фильтр по тегам 
  SortField sort_field = 6;              // сортировка
  SortOrder sort_order = 7;              // порядок сортировки
  string search_query = 8;               // поиск по содержанию/заголовку
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_page_token = 2;
  int32 total_count = 3;                 // общее число (может быть 0, если не считаем)
}

// -----------------------------------------------------------------------------
// SERVICE
// -----------------------------------------------------------------------------

service PostService {
  // CRUD
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);
  rpc RatePost(RatePostRequest) returns (RatePostResponse);

  // Listing
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
}
